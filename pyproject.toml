[project]
name = "niitti"
version = "0.1.0"
description = "Shared logging, tracing, and settings package for Klikkikuri services"
readme = "README.md"
authors = [
    { name = "Teemu Autto", email = "teemu@rautakuu.org" }
]
requires-python = ">=3.12"
dependencies = [
    # `niitti.paths` needs it, and `niitti.settings` did too without a declaration.
    "platformdirs>=4.3.6",
]

[project.optional-dependencies]
logging = [
    "structlog>=25.1.0",
    # `niitti.logging` imports `niitti.settings.logging`. OpenTelemetry is optional: `tracing` adds it.
    "niitti[settings]",
]
tracing = [
    "opentelemetry-instrumentation-logging>=0.50b0",
    "opentelemetry-sdk>=1.29.0",
    "sentry-sdk>=2.48.0",
]
settings = [
    "pydantic>=2.10.5",
    "pydantic-settings>=2.7.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "structlog>=25.1.0",
]
all = [
    "niitti[logging,settings,tracing]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
